<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics on Wall</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --current:  #ffffff;
      --near:     #484848;
      --far:      #282828;
      --meta:     #2a2a2a;
      --pad:      10vw;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    /* ── Stage ── */
    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }

    /* ── Lyrics block ── */
    #lyrics-block {
      display: none;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      padding: 0 var(--pad);
      gap: 3em;
    }

    .line {
      text-align: left;
      line-height: 1.2;
      transition: color 0.3s ease, opacity 0.3s ease, font-size 0.3s ease;
    }

    .line-far  { font-size: clamp(20px, 2.4vw, 36px); color: var(--far);  opacity: 1; }
    .line-near { font-size: clamp(26px, 3.4vw, 52px); color: var(--near); opacity: 1; }
    .line-cur  {
      font-size: clamp(32px, 5vw, 76px);
      font-weight: 700;
      color: var(--current);
      letter-spacing: -0.01em;
    }

    /* Scroll-up animation on line change */
    #lyrics-block.scrolling {
      animation: scroll-up 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    @keyframes scroll-up {
      from { transform: translateY(0.6em); opacity: 0.4; }
      to   { transform: translateY(0);     opacity: 1;   }
    }

    /* ── Song meta ── */
    #meta {
      position: fixed;
      bottom: 24px;
      right: 36px;
      text-align: right;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #meta.visible { opacity: 1; }
    #meta .title  { font-size: clamp(15px, 1.3vw, 22px); color: #666; font-weight: 600; }
    #meta .artist { font-size: clamp(13px, 1.1vw, 18px); color: #333; margin-top: 3px; }

    /* ── Listening ── */
    #listening {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    #listening .label {
      font-size: clamp(14px, 1.6vw, 22px);
      color: #222;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .dots { display: flex; gap: 9px; }
    .dot  {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #222;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40%           { transform: scale(1.0); opacity: 1;   }
    }

    /* ── No lyrics ── */
    #no-lyrics {
      display: none;
      font-size: clamp(20px, 3vw, 48px);
      color: #2a2a2a;
      text-align: left;
      padding: 0 var(--pad);
      width: 100%;
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="listening">
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="label">Listening</div>
  </div>

  <div id="no-lyrics"></div>

  <div id="lyrics-block">
    <div id="line-prev2" class="line line-far"></div>
    <div id="line-prev1" class="line line-near"></div>
    <div id="line-cur"   class="line line-cur"></div>
    <div id="line-next1" class="line line-near"></div>
    <div id="line-next2" class="line line-far"></div>
  </div>
</div>

<div id="meta">
  <div class="title"  id="meta-title"></div>
  <div class="artist" id="meta-artist"></div>
</div>

<script>
  const el = {
    listening:  document.getElementById('listening'),
    noLyrics:   document.getElementById('no-lyrics'),
    block:      document.getElementById('lyrics-block'),
    prev2:      document.getElementById('line-prev2'),
    prev1:      document.getElementById('line-prev1'),
    cur:        document.getElementById('line-cur'),
    next1:      document.getElementById('line-next1'),
    next2:      document.getElementById('line-next2'),
    meta:       document.getElementById('meta'),
    metaTitle:  document.getElementById('meta-title'),
    metaArtist: document.getElementById('meta-artist'),
  };

  let lastCurrent = '';

  function show(id) {
    el.listening.style.display = id === 'listening' ? 'flex'  : 'none';
    el.noLyrics.style.display  = id === 'no-lyrics'  ? 'block' : 'none';
    el.block.style.display     = id === 'lyrics'     ? 'flex'  : 'none';
  }

  function setMeta(artist, title) {
    el.metaTitle.textContent  = title  || '';
    el.metaArtist.textContent = artist || '';
    el.meta.classList.toggle('visible', !!(artist && title));
  }

  function scrollAnim() {
    el.block.classList.remove('scrolling');
    void el.block.offsetWidth; // reflow
    el.block.classList.add('scrolling');
  }

  function applyState(s) {
    if (s.status === 'listening') {
      show('listening');
      setMeta('', '');
      return;
    }
    if (s.status === 'no_lyrics') {
      show('no-lyrics');
      el.noLyrics.textContent = `♪ ${s.artist} — ${s.title}`;
      setMeta(s.artist, s.title);
      return;
    }
    if (s.status === 'lyrics') {
      show('lyrics');
      setMeta(s.artist, s.title);

      if (s.current !== lastCurrent) {
        scrollAnim();
        lastCurrent = s.current;
      }

      el.prev2.textContent = s.prev2 || '';
      el.prev1.textContent = s.prev1 || '';
      el.cur.textContent   = s.current || '';
      el.next1.textContent = s.next1 || '';
      el.next2.textContent = s.next2 || '';
    }
  }

  function connect() {
    const src = new EventSource('/stream');
    src.onmessage = e => { try { applyState(JSON.parse(e.data)); } catch(_) {} };
    src.onerror   = () => { src.close(); setTimeout(connect, 2000); };
  }

  show('listening');
  connect();
</script>
</body>
</html>
